<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grand Theft Auto VI Launch Gallery</title>
  <style>
    /* Reset & Fonts */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0b0c10;
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(219, 39, 119, 0.15), transparent 50%),
        linear-gradient(rgba(13, 27, 42, 0.9), rgba(13, 27, 42, 0.95)), 
        url('GtaGalary.avif');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #fff;
      min-height: 100vh;
      padding: 30px 15px;
      overflow-x: hidden;
    }

    /* Header / Hero Section */
    .hero {
      text-align: center;
      margin: 40px auto 60px;
      max-width: 800px;
      animation: fadeInDown 1s ease-out;
    }

    h1 {
      font-size: 3.2rem;
      background: linear-gradient(45deg, #f43f5e, #fbbf24, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 15px;
      filter: drop-shadow(0 4px 12px rgba(244, 63, 94, 0.4));
    }

    .subtitle {
      font-size: 1.25rem;
      color: #e2e8f0;
      line-height: 1.6;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
    }

    /* Gallery Container */
    .gallery-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 35px;
    }

    /* Card Container & Image Styling */
    .img-card, .featured-img {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      background-color: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(5px);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: fadeInUp 0.8s ease-out both;
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 14px;
      transition: transform 0.5s ease, filter 0.5s ease;
    }

    /* Hover Effects */
    .img-card:hover, .featured-img:hover {
      transform: translateY(-8px) scale(1.01);
      box-shadow: 0 15px 35px rgba(219, 39, 119, 0.35), 0 0 15px rgba(244, 63, 94, 0.2);
      border-color: rgba(244, 63, 94, 0.5);
    }

    .img-card:hover img, .featured-img:hover img {
      transform: scale(1.05);
      filter: brightness(1.1);
    }

    /* Layout Grids */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 25px;
    }

    .featured-img {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
    }

    .featured-img.medium {
      max-width: 650px;
    }

    .featured-img.large {
      max-width: 1050px;
    }

    /* Footer Section */
    .hero-footer {
      text-align: center;
      margin: 80px 0 40px;
      animation: fadeIn 1.2s ease-out;
    }

    h2 {
      color: #f43f5e;
      font-size: 2.2rem;
      margin-bottom: 25px;
      text-shadow: 0 0 10px rgba(244, 63, 94, 0.4);
    }

    h2 span {
      color: #fbbf24;
      font-weight: bold;
      position: relative;
      display: inline-block;
    }

    .cta-button {
      background: linear-gradient(135deg, #db2777 0%, #e11d48 100%);
      color: white;
      border: none;
      padding: 16px 45px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(219, 39, 119, 0.5);
      transition: all 0.3s ease;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .cta-button:hover {
      background: linear-gradient(135deg, #f43f5e 0%, #be185d 100%);
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 8px 30px rgba(244, 63, 94, 0.8);
    }

    .cta-button:active {
      transform: translateY(-1px);
    }

    /* Keyframe Animations */
    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Responsive Adjustments */
    @media (max-width: 768px) {
      h1 { font-size: 2.2rem; }
      h2 { font-size: 1.6rem; }
      .cta-button { padding: 14px 35px; font-size: 1rem; }
    }
  </style>
</head>
<body>

  <header class="hero">
    <h1>معرض الإطلاق</h1>
    <p class="subtitle">استكشف فايس سيتي وما وراءها مع لقطات شاشة جديدة ومذهلة من عالم اللعبة المرتقب!</p>
  </header>

  <main class="gallery-container">
    <div class="grid-2">
      <div class="img-card"><img src="Jason_and_Lucia 1avif.avif" alt="Jason and Lucia 1"></div>
      <div class="img-card"><img src="vice city disco.avif" alt="Vice City Disco"></div>
    </div>

    <div class="featured-img">
      <img src="Vice menaif.avif" alt="Vice City Scene">
    </div>

    <div class="featured-img large">
      <img src="Lucia_Caminos avif.avif" alt="Lucia Caminos">
    </div>

    <div class="featured-img">
      <img src="Jason & Lucia2.avif" alt="Jason and Lucia 2">
    </div>

    <div class="grid-2">
      <div class="img-card"><img src="Jason_Duval1.avif" alt="Jason Duval"></div>
      <div class="img-card"><img src="Vice gang1avif.avif" alt="Vice City Gang"></div>
    </div>

    <div class="featured-img medium">
      <img src="Port_Gellhorn dancer.avif" alt="Port Gellhorn Dancer">
    </div>

    <div class="featured-img">
      <img src="Jason_and_Lucia_3 avif.avif" alt="Jason and Lucia 3">
    </div>

    <div class="featured-img">
      <img src="Vice_City night 1s.avif" alt="Vice City Night">
    </div>

    <div class="featured-img">
      <img src="Hamzawi.png" alt="Hamzawi Scene">
    </div>
  </main>

  <footer class="hero-footer">
    <h2>نراكم في ليونيدا <span>في 19 من نوفمبر</span></h2>
    <button class="cta-button">Pre-Order Now</button>
  </footer>

</body>
</html>
